name: epay
description: "Emral Pay — all-in-one e-wallet + bill payment super-app prototype."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.2.0
  hooks_riverpod: ^3.3.2
  intl: ^0.20.2
  json_annotation: ^4.12.0
  lottie: ^3.5.1
  mobile_scanner: ^7.4.0
  pdfx: ^2.9.2
  qr_flutter: ^4.1.0
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/logo.png
    - assets/mock/billers.json
    - assets/mock/accounts.json
    - assets/mock/transactions.json
    - assets/mock/beneficiaries.json
    - assets/mock/fines.json
    - assets/mock/vehicles.json
    - assets/mock/institutions.json
    - assets/mock/cards.json
    - assets/mock/quotes.json
    - assets/mock/contacts.json
    - assets/mock/money_requests.json
    - assets/mock/merchants.json
    - assets/mock/recharge_plans.json
    - assets/mock/sample_bill.pdf
    - assets/mock/rental_locations.json
    - assets/mock/rental_vehicle_classes.json
    - assets/mock/rental_addons.json
